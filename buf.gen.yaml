version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/pitshifer/volatility/internal/gen
      
# Локальные плагины (не buf.build remote plugins), чтобы генерация работала
# офлайн и детерминированно. Перед первым запуском:
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
plugins:
  - local: protoc-gen-go
    out: internal/gen
    # source_relative + go_package из api.proto дают в сумме путь
    # internal/gen/proto/api/v1/api.pb.go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/gen
    opt: paths=source_relative
