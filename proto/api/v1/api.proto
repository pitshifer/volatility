syntax = "proto3";

// Пакет версионируем (v1), чтобы можно было завести v2 без ломающих
// изменений для существующих клиентов.
package cryptostream.api.v1;

// Путь и имя сгенерированного Go-пакета: buf сложит .pb.go сюда.
option go_package = "github.com/pitshifer/crypto-stream/internal/gen/proto/api/v1;apiv1";

// StreamerService — внешний API приложения crypto-stream.
service StreamerService {
  // GetSymbols возвращает список торговых пар, за которыми сейчас следит
  rpc GetSymbols(GetSymbolsRequest) returns (GetSymbolsResponse);
  rpc GetVolatility(GetVolatilityRequest) returns (GetVolatilityResponse);
  rpc Quote(QuoteRequest) returns (stream QuoteResponse);
}

// GetSymbolsRequest пуст: метод не принимает параметров, возвращает
// весь список прослушиваемых пар целиком.
message GetSymbolsRequest {}

message GetSymbolsResponse {
  // symbols — список тикеров в формате Binance, например "BTCUSDT".
  repeated string symbols = 1;
}

message GetVolatilityRequest {
  // symbol — тикер торговой пары в формате Binance, например "BTCUSDT".
  string symbol = 1;
}

message GetVolatilityResponse {
  string symbol = 1;
  // volatility — волатильность торговой пары за последние 24 часа в процентах, например 0.5 означает 0.5%.
  double volatility = 2;
}

message QuoteRequest {
  // symbol — тикер торговой пары в формате Binance, например "BTCUSDT".
  string symbol = 1;
}

message QuoteResponse {
  // symbol — тикер торговой пары в формате Binance, например "BTCUSDT".
  string symbol = 1;
  // price — текущая цена торговой пары в USDT.
  double price = 2;
  // trade_time — время получения котировки в формате Unix timestamp (секунды с начала эпохи).
  int64 trade_time = 3;
}
